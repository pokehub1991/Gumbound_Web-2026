<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gumbound Web 2026</title>
    <!-- Local Retro Pixel Fonts: Silkscreen, EditUndo & Pixeboy -->
    <style>
      @font-face {
        font-family: 'Silkscreen';
        src: url('/fonts/Silkscreen-Regular.ttf') format('truetype');
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'EditUndo';
        src: url('/fonts/editundo.ttf') format('truetype');
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Pixeboy';
        src: url('/fonts/Pixeboy.ttf') format('truetype');
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'GameFont';
        src: url('/fonts/Silkscreen-Regular.ttf') format('truetype');
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: inherit;
      }
      body, html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #dca04c;
        font-family: 'Silkscreen', 'GameFont', monospace, sans-serif;
        -webkit-font-smoothing: none;
        -moz-osx-font-smoothing: grayscale;
        image-rendering: pixelated;
      }
      #app {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #game-canvas-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #ui-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 10;
        pointer-events: none;
        font-family: 'Silkscreen', 'GameFont', monospace, sans-serif;
      }
      button, input, select, textarea, ::placeholder {
        font-family: 'Silkscreen', 'GameFont', monospace, sans-serif !important;
      }
      body.is-grabbing, body.is-grabbing * {
        cursor: url('/cursors/hand.png') 9 8, grabbing !important;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="game-canvas-container"></div>
      <div id="ui-overlay"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
