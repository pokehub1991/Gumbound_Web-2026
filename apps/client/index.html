<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover" />
    <title>Gumbound Web 2026</title>
    <!-- Local Retro Pixel Fonts: Pixelify Sans for Text, Silkscreen for Numbers -->
    <style>
      /* 1. Base composite font: Pixelify Sans for all characters/letters/symbols */
      @font-face {
        font-family: 'GameFont';
        src: url('/fonts/PixelifySans-Regular.ttf') format('truetype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'GameFont';
        src: url('/fonts/PixelifySans-Regular.ttf') format('truetype');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }

      /* 2. Overriding glyphs for numbers (0-9), degree symbol (°), and math operators (+, -, %, /): Silkscreen */
      @font-face {
        font-family: 'GameFont';
        src: url('/fonts/Silkscreen-Regular.ttf') format('truetype');
        unicode-range: U+0030-0039, U+00B0, U+002B, U+002D, U+0025, U+002F;
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'GameFont';
        src: url('/fonts/Silkscreen-Regular.ttf') format('truetype');
        unicode-range: U+0030-0039, U+00B0, U+002B, U+002D, U+0025, U+002F;
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }

      /* Standalone Text and characters font: Pixelify Sans */
      @font-face {
        font-family: 'Pixelify Sans';
        src: url('/fonts/PixelifySans-Regular.ttf') format('truetype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Pixelify Sans';
        src: url('/fonts/PixelifySans-Regular.ttf') format('truetype');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }

      /* Standalone Numbers font: Silkscreen */
      @font-face {
        font-family: 'Silkscreen';
        src: url('/fonts/Silkscreen-Regular.ttf') format('truetype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Silkscreen';
        src: url('/fonts/Silkscreen-Regular.ttf') format('truetype');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }

      /* Retro Arcade Chunky Font for Giant Timer: Pixeboy */
      @font-face {
        font-family: 'Pixeboy';
        src: url('/fonts/Pixeboy.ttf') format('truetype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: inherit;
      }
      body, html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: #dca04c;
        font-family: 'GameFont', 'Pixelify Sans', sans-serif;
        -webkit-font-smoothing: none;
        -moz-osx-font-smoothing: grayscale;
        image-rendering: pixelated;
        touch-action: none;
        -ms-touch-action: none;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        user-select: none;
        -webkit-user-select: none;
      }
      #app {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        touch-action: none;
      }
      #game-canvas-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #ui-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 10;
        pointer-events: none;
        font-family: 'GameFont', 'Pixelify Sans', sans-serif;
      }
      button, input, select, textarea, ::placeholder {
        font-family: 'GameFont', 'Pixelify Sans', sans-serif !important;
      }
      body.is-grabbing, body.is-grabbing * {
        cursor: url('/cursors/hand.png') 9 8, grabbing !important;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="game-canvas-container"></div>
      <div id="ui-overlay"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
