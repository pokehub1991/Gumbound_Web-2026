version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: gumbound_postgres
    restart: always
    environment:
      POSTGRES_USER: gumbound
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: gumbound_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: gumbound_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:

