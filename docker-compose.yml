version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: gumbound_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gumbound}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-gumbound_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: gumbound_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: gumbound_server
    restart: always
    ports:
      - "8080:8080"
    environment:
      GO_ENV: ${GO_ENV:-production}
      DATABASE_URL: "postgres://${POSTGRES_USER:-gumbound}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gumbound_dev}?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-}
      TLS_CERT: ${TLS_CERT:-}
      TLS_KEY: ${TLS_KEY:-}
      SEED_ACCOUNTS: ${SEED_ACCOUNTS:-0}
    env_file:
      - .env
    depends_on:
      - postgres
      - redis

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: gumbound_client
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  pgdata:
  redisdata:
